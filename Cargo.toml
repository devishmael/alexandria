[package]
name = "alexandria"
version = "1.0.0"
edition = "2024"
description = "Headless Deterministic Agent Harness & Kernel-Space Arbitrator"
license = "MIT"
authors = ["Devi Ishmael <devishmael@users.noreply.github.com>"]
repository = "https://github.com/devishmael/alexandria"
homepage = "https://github.com/devishmael/alexandria"
readme = "README.md"
keywords = ["agent", "harness", "mcp", "lsp", "deterministic"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "alexandria"
path = "src/lib.rs"

[[bin]]
name = "alexandria"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
rusqlite = { version = "0.33", features = ["bundled", "functions"] }
petgraph = "0.7"
pulldown-cmark = "0.12"
notify = "8.0"
notify-debouncer-mini = "0.6"
oxc_allocator = "0.56"
oxc_ast = "0.56"
oxc_ast_visit = "0.56"
oxc_parser = "0.56"
oxc_span = "0.56"
oxc_resolver = "4.0"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
